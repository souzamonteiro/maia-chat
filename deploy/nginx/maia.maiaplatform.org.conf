server {
    listen 80;
    listen [::]:80;
    server_name maia.maiaplatform.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name maia.maiaplatform.org;

    ssl_certificate /etc/letsencrypt/live/maia.maiaplatform.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maia.maiaplatform.org/privkey.pem;

    # Replace with the Maia Edge client WireGuard address.
    set $maia_upstream http://10.20.0.2:3080;

    # Document uploads are base64-encoded by the browser before forwarding.
    location /api/documents/ {
        client_max_body_size 15m;
        proxy_pass $maia_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $maia_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for streaming responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
