<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123f2b" />
    <meta
      name="description"
      content="Maia Chat is a local and independent interface for language models."
    />
    <meta property="og:title" content="Maia Chat" />
    <meta property="og:description" content="Open intelligence, close to your data." />
    <meta property="og:type" content="website" />
    <title>Maia Chat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/css/maia.css" />
  </head>
  <body>
    <div class="app-shell">
      <button
        class="sidebar-backdrop"
        id="sidebarBackdrop"
        type="button"
        data-i18n-aria-label="closeMenu"
      ></button>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <strong>Maia</strong>
            <small>Open intelligence</small>
          </div>
        </div>

        <button class="new-chat" id="newChatButton" type="button" data-i18n="newChat">
          + New chat
        </button>

        <label class="conversation-search" for="conversationSearch">
          <span data-i18n="searchChats">Search chats</span>
          <input
            id="conversationSearch"
            type="search"
            data-i18n-placeholder="searchPlaceholder"
            placeholder="Search conversations"
          />
        </label>
        <div class="conversation-list" id="conversationList"></div>

        <section class="document-library" aria-labelledby="collectionHeading">
          <div class="document-library-heading">
            <span id="collectionHeading" data-i18n="documentCollections">Documents</span>
            <button
              id="newCollectionButton"
              type="button"
              data-i18n-aria-label="newCollection"
              aria-label="New collection"
            >
              +
            </button>
          </div>
          <div class="collection-controls">
            <select
              id="collectionSelect"
              data-i18n-aria-label="documentCollections"
              aria-label="Documents"
            ></select>
            <button
              id="deleteCollectionButton"
              class="attachment-remove"
              type="button"
              data-i18n-aria-label="deleteCollection"
              aria-label="Delete collection"
            >
              x
            </button>
          </div>
          <div
            class="collection-document-list"
            id="collectionDocumentList"
            aria-live="polite"
          ></div>
          <label class="collection-add" for="collectionDocumentInput"
            ><span data-i18n="addDocuments">Add documents</span>
            <input
              id="collectionDocumentInput"
              type="file"
              accept=".txt,.text,.md,.markdown,.csv,.json,.log,.c,.cc,.cpp,.cxx,.h,.hpp,.cs,.css,.html,.htm,.xml,.yaml,.yml,.ini,.cfg,.conf,.toml,.js,.mjs,.jsx,.ts,.tsx,.py,.java,.kt,.kotlin,.go,.rs,.php,.rb,.pl,.sh,.bash,.lua,.r,.m,.swift,.sql,.maia,.maiascript,.ebnf,.env,.env.example,.gitignore,Makefile,Dockerfile,CMakeLists.txt,.pdf,.docx,.xlsx,.pptx"
              multiple
            />
          </label>
        </section>

        <div class="sidebar-footer">
          <label for="modelSelect" data-i18n="model">Model</label>
          <select id="modelSelect"></select>
          <p class="model-details" id="modelDetails"></p>
          <div class="status" role="status" aria-live="polite" aria-atomic="true">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Checking server…</span>
          </div>
          <small class="app-version" id="appVersion"></small>
          <a
            class="policy-link"
            href="/models.html"
            target="_blank"
            rel="noopener"
            data-i18n="modelInfo"
            >Model info</a
          >
          <a
            class="policy-link"
            href="/privacy.html"
            target="_blank"
            rel="noopener"
            data-i18n="privacy"
            >Privacy & use</a
          >
          <a
            class="policy-link"
            href="https://github.com/souzamonteiro/maia-chat"
            target="_blank"
            rel="noopener"
            data-i18n="sourceCode"
            >Source code</a
          >
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button
            class="menu-button"
            id="menuButton"
            type="button"
            data-i18n-aria-label="menu"
            aria-label="Toggle menu"
          >
            ☰
          </button>
          <div>
            <strong id="pageTitle">Maia</strong>
            <span id="modelBadge">Local AI</span>
          </div>
          <label class="theme-select" for="languageSelect"
            ><span data-i18n="language">Language</span>
            <select id="languageSelect" data-i18n-aria-label="language" aria-label="Language">
              <option value="en">English</option>
              <option value="pt">Português</option>
              <option value="es">Español</option>
            </select>
          </label>
          <label class="theme-select" for="themeSelect"
            ><span data-i18n="theme">Theme</span>
            <select id="themeSelect" data-i18n-aria-label="theme" aria-label="Theme">
              <option value="system" data-i18n="system">System</option>
              <option value="light" data-i18n="light">Light</option>
              <option value="dark" data-i18n="dark">Dark</option>
            </select>
          </label>
          <div class="conversation-tools">
            <button class="clear-button" id="renameButton" type="button" data-i18n="rename">
              Rename
            </button>
            <button
              class="clear-button"
              id="exportMarkdownButton"
              type="button"
              data-i18n="exportMarkdown"
            >
              Export MD
            </button>
            <button
              class="clear-button"
              id="exportHistoryButton"
              type="button"
              data-i18n="exportJson"
            >
              Export JSON
            </button>
            <label class="clear-button" for="importHistoryInput"
              ><span data-i18n="importJson">Import JSON</span>
              <input id="importHistoryInput" type="file" accept="application/json,.json" />
            </label>
            <button
              class="clear-button danger-button"
              id="deleteConversationButton"
              type="button"
              data-i18n="delete"
            >
              Delete
            </button>
          </div>
          <button class="clear-button" id="clearButton" type="button" data-i18n="clear">
            Clear
          </button>
        </header>

        <div class="app-notice hidden" id="appNotice" role="status" aria-live="polite">
          <span id="appNoticeText"></span>
          <button
            class="message-action hidden"
            id="retryConnectionButton"
            type="button"
            data-i18n="retry"
          >
            Retry
          </button>
        </div>

        <section
          class="chat"
          id="chat"
          data-i18n-aria-label="conversation"
          aria-label="Conversation"
        >
          <div class="welcome" id="welcome">
            <div class="welcome-mark">M</div>
            <h1 data-i18n="welcome">How can I help you?</h1>
            <p data-i18n="welcomeText">
              Maia is an open interface for local and independent language models.
            </p>
          </div>
        </section>

        <form class="composer" id="composer">
          <div class="composer-box">
            <textarea
              id="prompt"
              rows="1"
              data-i18n-placeholder="messagePlaceholder"
              data-i18n-aria-label="message"
              placeholder="Ask Maia..."
              aria-label="Message"
            ></textarea>
            <div class="attachment-list" id="attachmentList" aria-live="polite"></div>
            <p class="attachment-error" id="attachmentError" aria-live="polite"></p>
            <section class="web-search hidden" id="webSearch" aria-labelledby="webSearchLabel">
              <div class="web-search-controls">
                <label id="webSearchLabel" for="webSearchQuery" data-i18n="webSearch"
                  >Web search</label
                >
                <input
                  id="webSearchQuery"
                  type="search"
                  data-i18n-placeholder="webSearchPlaceholder"
                  placeholder="Search the web"
                />
                <button id="webSearchButton" type="button" data-i18n="search">Search</button>
              </div>
              <div class="web-search-results" id="webSearchResults" aria-live="polite"></div>
            </section>
            <details class="generation-controls">
              <summary data-i18n="generation">Generation</summary>
              <label
                >Temperature
                <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0.7"
              /></label>
              <label
                >Top-p
                <input id="topPInput" type="number" min="0.01" max="1" step="0.01" value="0.9"
              /></label>
              <label
                ><span data-i18n="maxTokens">Max tokens</span>
                <input id="maxTokensInput" type="number" min="1" max="8192" step="1" value="2048"
              /></label>
              <label
                ><span data-i18n="expandReasoning">Expand reasoning</span>
                <input id="expandReasoningInput" type="checkbox"
              /></label>
            </details>
            <div class="composer-actions">
              <span class="hint" data-i18n="shortcutHint"
                >Enter to send · Shift+Enter for a new line</span
              >
              <span class="context-status" id="contextStatus" aria-live="polite"></span>
              <label class="attach-button" for="attachmentInput"
                ><span data-i18n="attachFile">Attach file</span>
                <input
                  id="attachmentInput"
                  type="file"
                  accept=".txt,.text,.md,.markdown,.csv,.json,.log,.c,.cc,.cpp,.cxx,.h,.hpp,.cs,.css,.html,.htm,.xml,.yaml,.yml,.ini,.cfg,.conf,.toml,.js,.mjs,.jsx,.ts,.tsx,.py,.java,.kt,.kotlin,.go,.rs,.php,.rb,.pl,.sh,.bash,.lua,.r,.m,.swift,.sql,.maia,.maiascript,.ebnf,.env,.env.example,.gitignore,Makefile,Dockerfile,CMakeLists.txt,.pdf,.docx,.xlsx,.pptx"
                  multiple
                />
              </label>
              <button class="stop-button hidden" id="stopButton" type="button" data-i18n="stop">
                Stop
              </button>
              <button class="send-button" id="sendButton" type="submit" data-i18n="send">
                Send
              </button>
            </div>
          </div>
        </form>
      </main>
    </div>
    <div class="undo-notice hidden" id="undoNotice" role="status">
      <span id="undoText"></span>
      <button id="undoDeleteButton" type="button">Undo</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "marked": "/vendor/marked/marked.esm.js",
          "dompurify": "/vendor/dompurify/purify.es.mjs",
          "highlight.js": "/vendor/highlight.js/es/highlight.min.js"
        }
      }
    </script>
    <script type="module" src="/js/app.js?v=8"></script>
  </body>
</html>
